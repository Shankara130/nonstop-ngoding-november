<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concurrent Simulation Dashboard</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <h1>⚙️ Concurrent Simulation Dashboard</h1>
  <div id="controls">
    <button id="toggle">⏸️ Pause</button>
    <span id="tick">Tick: 0</span>
  </div>
  <canvas id="world" width="500" height="500"></canvas>

  <script>
    const ws = new WebSocket("ws://" + location.host + "/ws");
    const canvas =document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const tickEl = document.getElementById("tick");
    const toggleBtn = document.getElementById("toggle");

    let paused = false;

    toggleBtn.onclick = () => {
      paused = !paused;
      toggleBtn.innerText = paused ? "▶️ Start" : "⏸️ Pause";
    };

    ws.onmessage = (event) => {
      if (paused) return;

      const raw = event.data.toString().trim();
      raw.split('\n').forEach(chunck => {
        if (!chunck) return;
        try {
          const payload = JSON.parse(chunck);
          if (payload.type === "snapshot") {
            renderAgents(payload.agents);
            tickEl.innerText = "Tick: " + payload.tick;
          }
        } catch (err) {
          console.error("Invalid JSON from ws:", err, chunck);
        }
      });
    };

    function renderAgents(agents) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      agents.forEach(a => {
        const x = (a.x / 100) * canvas.width;
        const y = (a.y / 100) * canvas.height;
        let color;

        switch (a.state) {
          case "idle": color = "#aaa"; break;
          case "moving": color = "#4caf50"; break;
          case "interact": color = "#ff5722"; break;
          default: color = "#2196f3";
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + a.dx * 8, y + a.dy * 8);
        ctx.stroke();
      });
    }
  </script>
</body>
</html>
