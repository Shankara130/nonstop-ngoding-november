<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concurrent Simulation Dashboard</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0e0e0e;
      color: #eee;
      text-align: center;
    }
    canvas {
      border: 2px solid #555;
      background: #111;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>⚙️ Concurrent Simulation Dashboard</h1>
  <canvas id="world" width="400" height="400"></canvas>
  <div id="tick">Tick: 0</div>

  <script>
    const ws = new WebSocket("ws://" + location.host + "/ws");
    const canvas =document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const tickEl = document.getElementById("tick");

    ws.onopen = () => console.log("WS connected");
    ws.onclose = () => console.log("WS closed");
    ws.onerror = (e) => console.error("WS error:", e);

    ws.onmessage = (event) => {
      const raw = event.data.toString().trim();
      raw.split('\n').forEach(chunck => {
        if (!chunck) return;
        try {
          const payload = JSON.parse(chunck);
          if (payload.type === "snapshot") {
            renderAgents(payload.agents);
            tickEl.innerText = "Tick: " + payload.tick;
          }
        } catch (err) {
          console.error("Invalid JSON from ws:", err, chunck);
        }
      });
    };

    function renderAgents(agents) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      agents.forEach(a => {
        const x = (a.x / 100) * canvas.width;
        const y = (a.y / 100) * canvas.height;
        const color = `hsl(${(a.id * 47) % 360} 80% 60%)`;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  </script>
</body>
</html>
